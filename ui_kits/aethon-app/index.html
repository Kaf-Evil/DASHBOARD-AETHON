<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Aethon — UI Kit</title>
<link rel="stylesheet" href="../../colors_and_type.css"/>
<style>
  html, body, #root { height: 100%; margin: 0; }
  body { background: #F8FAFC; font-family: 'Inter', sans-serif; color: #1E293B; }
  * { box-sizing: border-box; }
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
<div id="root"></div>

<script type="text/babel" src="Icon.jsx"></script>
<script type="text/babel" src="Components.jsx"></script>
<script type="text/babel" src="Screens.jsx"></script>
<script type="text/babel" src="MoreScreens.jsx"></script>

<script type="text/babel">
const App = () => {
  const [authed, setAuthed] = React.useState(true);
  const [screen, setScreen] = React.useState("dashboard");

  if (!authed) return <LoginScreen onLogin={() => setAuthed(true)}/>;

  return (
    <div style={{ display: "flex", height: "100vh", fontFamily: "Inter, sans-serif" }}>
      <Sidebar active={screen} onNav={setScreen}/>
      <div style={{ flex: 1, display: "flex", flexDirection: "column", minWidth: 0 }}>
        <Topbar/>
        <div style={{ flex: 1, background: "#F8FAFC", overflow: "hidden", display: "flex", flexDirection: "column" }}>
          {screen === "dashboard" && <DashboardScreen/>}
          {screen === "liquidaciones" && <LiquidacionesScreen/>}
          {screen === "funcionarios" && <FuncionarioScreen/>}
          {screen === "aps" && <APSScreen/>}
          {screen === "honorarios" && <HonorariosScreen/>}
          {screen === "nuevo" && <NuevoFuncionarioScreen/>}
          {screen === "vacaciones" && <VacacionesScreen/>}
          {screen === "licencias" && <LicenciasScreen/>}
          {screen === "capacitacion" && <CapacitacionScreen/>}
          {screen === "bienestar" && <BienestarScreen/>}
          {screen === "ia" && <IAChatScreen/>}
          {screen === "contratos" && <ContratosScreen/>}
          {screen === "asistencia" && <AsistenciaScreen/>}
          {screen === "evaluacion" && <EvaluacionScreen/>}
          {!["dashboard", "liquidaciones", "funcionarios", "aps", "honorarios", "nuevo", "vacaciones", "licencias", "capacitacion", "bienestar", "ia", "contratos", "asistencia", "evaluacion"].includes(screen) &&
            <div style={{ padding: 40, color: "#94A3B8", fontSize: 14 }}>
              <div style={{ fontSize: 11, fontWeight: 700, letterSpacing: ".15em", textTransform: "uppercase", color: "#2563EB", marginBottom: 6 }}>Próximamente</div>
              <h1 style={{ fontSize: 26, color: "#0A1628", margin: 0 }}>Módulo "{screen}"</h1>
              <p style={{ marginTop: 8 }}>Esta sección aún no está implementada en el UI kit. Vuelve al Dashboard para ver el flujo principal.</p>
              <div style={{ marginTop: 14 }}><Button variant="primary" onClick={() => setScreen("dashboard")} icon="arrow">Volver al Dashboard</Button></div>
            </div>
          }
        </div>
      </div>
    </div>
  );
};

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
