<!doctype html>
<html lang="es"><head>
<meta charset="utf-8"/>
<title>KPI Cards</title>
<link rel="stylesheet" href="../colors_and_type.css"/>
<style>
  body{margin:0;background:var(--bg2);padding:22px 28px;}
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;}
  .card{background:#fff;border-radius:12px;border:1.5px solid var(--border);box-shadow:var(--shadow-base);padding:18px 20px;}
  .t{font-size:13px;font-weight:700;color:var(--fg1);margin-bottom:4px;}
  .v{font-size:26px;font-weight:800;color:var(--fg1);letter-spacing:-.03em;font-feature-settings:"tnum" 1;}
  .s{font-size:11.5px;color:var(--fg4);margin-top:4px;}
</style></head>
<body>
<div class="grid">
  <div class="card"><div class="t">Total Imponible</div><div class="v">$142.380.500</div><div class="s">+3.2% vs mes anterior</div></div>
  <div class="card"><div class="t">Funcionarios</div><div class="v">847</div><div class="s">Período Mayo 2026</div></div>
  <div class="card" style="border-left:3px solid var(--logo-gold)"><div class="t">Contratos por vencer</div><div class="v" style="color:var(--warning)">12</div><div class="s">Próximos 30 días</div></div>
</div>
</body></html>
