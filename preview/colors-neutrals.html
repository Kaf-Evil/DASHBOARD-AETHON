<!doctype html>
<html lang="es"><head>
<meta charset="utf-8"/>
<title>Neutrals</title>
<link rel="stylesheet" href="../colors_and_type.css"/>
<style>
  body{margin:0;background:#fff;padding:24px 28px;}
  .row{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;}
  .swatch{border-radius:10px;overflow:hidden;border:1.5px solid rgba(0,0,0,.06);}
  .chip{height:72px;}
  .info{padding:10px 12px;background:#fff;}
  .name{font-size:12px;font-weight:700;color:var(--fg1);}
  .hex{font-family:var(--font-mono);font-size:10.5px;color:var(--fg4);margin-top:1px;}
  .use{font-size:10px;color:var(--fg3);margin-top:2px;}
</style></head>
<body>
<div class="row">
  <div class="swatch"><div class="chip" style="background:#1E293B"></div><div class="info"><div class="name">slate-800</div><div class="hex">#1E293B</div><div class="use">Texto principal</div></div></div>
  <div class="swatch"><div class="chip" style="background:#475569"></div><div class="info"><div class="name">slate-600</div><div class="hex">#475569</div><div class="use">Texto secundario</div></div></div>
  <div class="swatch"><div class="chip" style="background:#94A3B8"></div><div class="info"><div class="name">slate-400</div><div class="hex">#94A3B8</div><div class="use">Placeholders</div></div></div>
  <div class="swatch"><div class="chip" style="background:#F8FAFC;border-bottom:1px solid #E2E8F0;"></div><div class="info"><div class="name">slate-50</div><div class="hex">#F8FAFC</div><div class="use">App background</div></div></div>
</div>
</body></html>
