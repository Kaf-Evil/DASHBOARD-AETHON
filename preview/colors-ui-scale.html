<!doctype html>
<html lang="es"><head>
<meta charset="utf-8"/>
<title>UI Blue Scale</title>
<link rel="stylesheet" href="../colors_and_type.css"/>
<style>
  body{margin:0;background:#fff;padding:24px 28px;}
  .row{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;}
  .swatch{border-radius:10px;overflow:hidden;border:1.5px solid rgba(0,0,0,.06);}
  .chip{height:64px;}
  .info{padding:10px 12px;background:#fff;}
  .name{font-size:12px;font-weight:700;color:var(--fg1);}
  .hex{font-family:var(--font-mono);font-size:10.5px;color:var(--fg4);margin-top:1px;}
  .use{font-size:10px;color:var(--fg3);margin-top:2px;line-height:1.35;}
</style></head>
<body>
<div class="row">
  <div class="swatch"><div class="chip" style="background:#1A3158"></div><div class="info"><div class="name">aethon-700</div><div class="hex">#1A3158</div><div class="use">Hover oscuro</div></div></div>
  <div class="swatch"><div class="chip" style="background:#2563EB"></div><div class="info"><div class="name">aethon-500</div><div class="hex">#2563EB</div><div class="use">Botón primario</div></div></div>
  <div class="swatch"><div class="chip" style="background:#3B82F6"></div><div class="info"><div class="name">aethon-400</div><div class="hex">#3B82F6</div><div class="use">Hover claro</div></div></div>
  <div class="swatch"><div class="chip" style="background:#DBEAFE"></div><div class="info"><div class="name">aethon-100</div><div class="hex">#DBEAFE</div><div class="use">Badge bg</div></div></div>
  <div class="swatch"><div class="chip" style="background:#EFF6FF"></div><div class="info"><div class="name">aethon-50</div><div class="hex">#EFF6FF</div><div class="use">Wash sutil</div></div></div>
</div>
</body></html>
