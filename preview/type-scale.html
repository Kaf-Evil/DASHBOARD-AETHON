<!doctype html>
<html lang="es"><head>
<meta charset="utf-8"/>
<title>Type Scale</title>
<link rel="stylesheet" href="../colors_and_type.css"/>
<style>
  body{margin:0;background:#fff;padding:18px 24px;}
  .row{display:flex;align-items:baseline;gap:20px;padding:10px 0;border-bottom:1px solid var(--border);}
  .row:last-child{border-bottom:none;}
  .meta{width:88px;flex-shrink:0;}
  .mn{font-size:10px;font-weight:700;color:var(--aethon-500);text-transform:uppercase;letter-spacing:.1em;}
  .ms{font-size:9.5px;color:var(--fg4);font-family:var(--font-mono);margin-top:1px;line-height:1.4;}
  .s{flex:1;color:var(--fg1);}
</style></head>
<body>
<div class="row"><div class="meta"><div class="mn">Display</div><div class="ms">56/900/-.04</div></div><div class="s" style="font-size:44px;font-weight:900;letter-spacing:-.04em;line-height:1;">AETHON</div></div>
<div class="row"><div class="meta"><div class="mn">H1</div><div class="ms">36/800/-.03</div></div><div class="s" style="font-size:30px;font-weight:800;letter-spacing:-.03em;">Sistema de Remuneraciones</div></div>
<div class="row"><div class="meta"><div class="mn">H2</div><div class="ms">24/700/-.02</div></div><div class="s" style="font-size:22px;font-weight:700;letter-spacing:-.02em;">Liquidaciones del Período</div></div>
<div class="row"><div class="meta"><div class="mn">H3</div><div class="ms">18/700/-.01</div></div><div class="s" style="font-size:17px;font-weight:700;">Resumen de haberes</div></div>
<div class="row"><div class="meta"><div class="mn">Body</div><div class="ms">15/400/0</div></div><div class="s" style="font-size:14px;font-weight:400;color:var(--fg2);line-height:1.6;">El sistema procesa remuneraciones bajo dos regímenes simultáneos.</div></div>
<div class="row"><div class="meta"><div class="mn">Label</div><div class="ms">11/700/+.1</div></div><div class="s" style="font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--fg4);">SUELDO BASE · AFP · SALUD</div></div>
</body></html>
