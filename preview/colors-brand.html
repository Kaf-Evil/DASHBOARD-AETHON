<!doctype html>
<html lang="es"><head>
<meta charset="utf-8"/>
<title>Brand Colors</title>
<link rel="stylesheet" href="../colors_and_type.css"/>
<style>
  body{margin:0;background:#fff;padding:24px 28px;}
  .row{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;}
  .swatch{border-radius:12px;overflow:hidden;border:1.5px solid rgba(0,0,0,.06);}
  .chip{height:80px;}
  .info{padding:12px 14px;background:#fff;}
  .name{font-size:13px;font-weight:700;color:var(--fg1);}
  .hex{font-family:var(--font-mono);font-size:11px;font-weight:600;color:var(--fg4);letter-spacing:.06em;margin-top:1px;}
  .use{font-size:11px;color:var(--fg3);margin-top:3px;line-height:1.4;}
</style></head>
<body>
<div class="row">
  <div class="swatch"><div class="chip" style="background:#0A1628"></div><div class="info"><div class="name">Aethon Deep Navy</div><div class="hex">#0A1628</div><div class="use">Sidebar, dark surfaces</div></div></div>
  <div class="swatch"><div class="chip" style="background:#1960a6"></div><div class="info"><div class="name">Aethon Blue</div><div class="hex">#1960A6</div><div class="use">Logo blue · headlines · links</div></div></div>
  <div class="swatch"><div class="chip" style="background:#f0a026"></div><div class="info"><div class="name">Aethon Gold</div><div class="hex">#F0A026</div><div class="use">Premium CTAs · Ley 19.378 highlight</div></div></div>
</div>
</body></html>
