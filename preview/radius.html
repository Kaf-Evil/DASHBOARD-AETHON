<!doctype html>
<html lang="es"><head>
<meta charset="utf-8"/>
<title>Border Radius</title>
<link rel="stylesheet" href="../colors_and_type.css"/>
<style>
  body{margin:0;background:#fff;padding:22px 28px;}
  .row{display:flex;gap:14px;flex-wrap:wrap;}
  .card{background:#fff;border:1.5px solid var(--border);display:flex;flex-direction:column;align-items:center;gap:8px;padding:14px 14px 12px;flex:1;min-width:88px;}
  .box{width:48px;height:48px;background:var(--aethon-100);border:2px solid var(--aethon-300);}
  .n{font-size:10.5px;font-weight:700;color:var(--aethon-500);text-transform:uppercase;letter-spacing:.08em;}
  .v{font-size:10px;color:var(--fg4);font-family:var(--font-mono);text-align:center;}
</style></head>
<body>
<div class="row">
  <div class="card" style="border-radius:4px"><div class="box" style="border-radius:4px"></div><div class="n">SM</div><div class="v">4px<br/>badges</div></div>
  <div class="card" style="border-radius:8px"><div class="box" style="border-radius:8px"></div><div class="n">Base</div><div class="v">8px<br/>botones</div></div>
  <div class="card" style="border-radius:12px"><div class="box" style="border-radius:12px"></div><div class="n">XL</div><div class="v">12px<br/>cards</div></div>
  <div class="card" style="border-radius:16px"><div class="box" style="border-radius:16px"></div><div class="n">2XL</div><div class="v">16px<br/>modals</div></div>
  <div class="card" style="border-radius:20px"><div class="box" style="border-radius:20px"></div><div class="n">3XL</div><div class="v">20px<br/>hero</div></div>
  <div class="card" style="border-radius:9999px"><div class="box" style="border-radius:9999px"></div><div class="n">Full</div><div class="v">9999<br/>avatar</div></div>
</div>
</body></html>
