<!doctype html>
<html lang="es"><head>
<meta charset="utf-8"/>
<title>Type Weights</title>
<link rel="stylesheet" href="../colors_and_type.css"/>
<style>
  body{margin:0;background:#fff;padding:24px 28px;}
  .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;}
  .card{background:#fff;border:1.5px solid var(--border);border-radius:10px;padding:18px;}
  .ag{font-size:32px;color:var(--fg1);line-height:1;margin-bottom:8px;}
  .lab{font-size:10.5px;color:var(--fg4);font-weight:700;text-transform:uppercase;letter-spacing:.08em;}
  .v{font-size:10.5px;color:var(--fg3);margin-top:2px;}
</style></head>
<body>
<div class="grid">
  <div class="card"><div class="ag" style="font-weight:300">Ag</div><div class="lab">Light</div><div class="v">300 · decorativo</div></div>
  <div class="card"><div class="ag" style="font-weight:400">Ag</div><div class="lab">Regular</div><div class="v">400 · cuerpo</div></div>
  <div class="card"><div class="ag" style="font-weight:600">Ag</div><div class="lab">SemiBold</div><div class="v">600 · UI labels</div></div>
  <div class="card"><div class="ag" style="font-weight:800">Ag</div><div class="lab">ExtraBold</div><div class="v">800 · KPIs · titulares</div></div>
</div>
</body></html>
