<!doctype html>
<html lang="es"><head>
<meta charset="utf-8"/>
<title>Numbers</title>
<link rel="stylesheet" href="../colors_and_type.css"/>
<style>
  body{margin:0;background:#fff;padding:24px 28px;}
  .row{display:flex;gap:32px;flex-wrap:wrap;align-items:baseline;}
  .lab{font-size:10.5px;color:var(--fg4);margin-bottom:4px;text-transform:uppercase;letter-spacing:.08em;font-weight:700;}
  .num{font-feature-settings:"tnum" 1;}
</style></head>
<body>
<div class="row">
  <div><div class="lab">KPI grande</div><div class="num" style="font-size:32px;font-weight:800;letter-spacing:-.03em;color:var(--fg1)">$2.847.320</div></div>
  <div><div class="lab">Tabla</div><div class="num" style="font-size:15px;font-weight:600;color:var(--fg1)">$847.500</div></div>
  <div><div class="lab">Δ positiva</div><div class="num" style="font-size:15px;font-weight:600;color:var(--success)">+$32.400</div></div>
  <div><div class="lab">Δ negativa</div><div class="num" style="font-size:15px;font-weight:600;color:var(--danger)">−$18.200</div></div>
  <div><div class="lab">RUT</div><div class="num" style="font-size:15px;font-weight:600;font-family:var(--font-mono);color:var(--fg1)">9.583.637-2</div></div>
</div>
</body></html>
