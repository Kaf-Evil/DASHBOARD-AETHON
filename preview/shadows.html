<!doctype html>
<html lang="es"><head>
<meta charset="utf-8"/>
<title>Shadows</title>
<link rel="stylesheet" href="../colors_and_type.css"/>
<style>
  body{margin:0;background:var(--bg2);padding:24px 28px;}
  .row{display:flex;gap:22px;flex-wrap:wrap;}
  .card{background:#fff;border-radius:12px;padding:18px 22px;display:flex;flex-direction:column;align-items:center;gap:6px;flex:1;min-width:110px;}
  .n{font-size:10.5px;font-weight:700;color:var(--aethon-500);text-transform:uppercase;letter-spacing:.08em;}
  .v{font-size:10.5px;color:var(--fg4);text-align:center;}
</style></head>
<body>
<div class="row">
  <div class="card" style="box-shadow:0 1px 2px rgba(0,0,0,.05)"><div class="n">sm</div><div class="v">tablas</div></div>
  <div class="card" style="box-shadow:0 1px 3px rgba(0,0,0,.07),0 1px 2px rgba(0,0,0,.04)"><div class="n">base</div><div class="v">KPI cards</div></div>
  <div class="card" style="box-shadow:0 4px 6px rgba(0,0,0,.05),0 2px 4px rgba(0,0,0,.04)"><div class="n">md</div><div class="v">dropdowns</div></div>
  <div class="card" style="box-shadow:0 10px 15px rgba(0,0,0,.08),0 4px 6px rgba(0,0,0,.04)"><div class="n">lg</div><div class="v">sidebar</div></div>
  <div class="card" style="box-shadow:0 25px 50px rgba(0,0,0,.15)"><div class="n">2xl</div><div class="v">modals</div></div>
</div>
</body></html>
