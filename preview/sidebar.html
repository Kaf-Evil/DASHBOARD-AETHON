<!doctype html>
<html lang="es"><head>
<meta charset="utf-8"/>
<title>Sidebar</title>
<link rel="stylesheet" href="../colors_and_type.css"/>
<style>
  body{margin:0;background:var(--bg2);padding:0;display:flex;}
  .sb{background:var(--aethon-900);width:240px;padding:18px 0;min-height:300px;}
  .lg{display:flex;align-items:center;gap:10px;padding:0 16px 14px;border-bottom:1px solid rgba(255,255,255,.08);margin-bottom:10px;}
  .lg img{height:30px;}
  .lg .t{font-size:14px;font-weight:800;color:#fff;letter-spacing:.02em;}
  .gp{font-size:9px;font-weight:700;letter-spacing:.15em;text-transform:uppercase;color:rgba(255,255,255,.3);padding:8px 16px 4px;}
  .it{display:flex;align-items:center;gap:10px;padding:8px 14px;margin:1px 8px;border-radius:8px;font-size:13px;font-weight:500;color:rgba(255,255,255,.55);}
  .it.act{background:#2563EB;color:#fff;}
  .dot{width:14px;height:14px;border-radius:3px;background:currentColor;opacity:.5;}
  .it.act .dot{opacity:1;}
  .pad{flex:1;padding:24px 28px;}
  .pad h2{font-size:18px;font-weight:800;color:var(--fg1);letter-spacing:-.02em;}
  .pad p{font-size:12.5px;color:var(--fg3);margin-top:6px;}
</style></head>
<body>
<div class="sb">
  <div class="lg"><img src="../assets/aethon-logo-light.svg"/><div class="t">AETHON</div></div>
  <div class="gp">Operación</div>
  <div class="it act"><div class="dot"></div>Dashboard</div>
  <div class="it"><div class="dot"></div>Funcionarios</div>
  <div class="it"><div class="dot"></div>Liquidaciones</div>
  <div class="gp">Ley 19.378</div>
  <div class="it"><div class="dot"></div>APS</div>
  <div class="it"><div class="dot"></div>Reportes</div>
</div>
<div class="pad"><h2>Sidebar — navy + white + gold</h2><p>240px fijo · group labels en mayúsculas a 30% opacidad · item activo con bg <code>aethon-500</code>.</p></div>
</body></html>
