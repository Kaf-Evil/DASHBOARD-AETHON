<!doctype html>
<html lang="es"><head>
<meta charset="utf-8"/>
<title>Buttons</title>
<link rel="stylesheet" href="../colors_and_type.css"/>
<style>
  body{margin:0;background:#fff;padding:22px 26px;display:flex;flex-direction:column;gap:14px;font-family:var(--font-sans);}
  .label{font-size:9.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:#94A3B8;margin-bottom:-4px;}
  .row{display:flex;flex-wrap:wrap;gap:9px;align-items:center;}

  .btn{
    position:relative;
    display:inline-flex;align-items:center;justify-content:center;gap:7px;
    padding:9px 16px;border-radius:8px;
    font-size:13px;font-weight:600;font-family:var(--font-sans);
    border:1.5px solid transparent;cursor:pointer;letter-spacing:-.005em;
    transition:background .16s ease-out, border-color .16s ease-out,
               box-shadow .16s ease-out, transform .08s ease-out, color .14s ease-out;
    overflow:hidden;
    user-select:none;
  }
  .btn:active{transform:translateY(1px) scale(.985);}
  .btn:active::after{
    content:"";position:absolute;inset:0;border-radius:inherit;
    background:rgba(255,255,255,.18);pointer-events:none;
  }
  .btn:focus-visible{outline:none;box-shadow:0 0 0 3px rgba(37,99,235,.28);}

  /* Hover-swap label/icon trick:
     each button has .label-text + .label-icon; on hover label fades out, icon fades in. */
  .btn .label-text,
  .btn .label-icon{
    display:inline-flex;align-items:center;gap:7px;
    transition:opacity .18s ease-out, transform .18s ease-out;
  }
  .btn .label-icon{
    position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    opacity:0;transform:scale(.9);
  }
  .btn:hover .label-text{opacity:0;transform:scale(1.02);}
  .btn:hover .label-icon{opacity:1;transform:scale(1);}

  /* ── Primary: brand blue (Generar PDF) ── */
  .btn-primary{
    background:#1960A6;color:#fff;
    box-shadow:0 1px 0 rgba(10,22,40,.18), inset 0 1px 0 rgba(255,255,255,.12);
  }
  .btn-primary:hover{background:#154E87;}

  /* ── Secondary: paper white ── */
  .btn-secondary{
    background:#fff;color:#0A1628;border-color:#CBD5E1;
    box-shadow:0 1px 0 rgba(15,23,42,.04);
  }
  .btn-secondary:hover{background:#F8FAFC;border-color:#94A3B8;}

  /* ── Excel export: signature Excel green (de Microsoft) ── */
  .btn-excel{
    background:#107C41;color:#fff;
    box-shadow:0 1px 0 rgba(7,46,24,.28), inset 0 1px 0 rgba(255,255,255,.14);
  }
  .btn-excel:hover{background:#0B6334;}

  /* ── Pay: teal cobre — distinto del status verde ── */
  .btn-pay{
    background:#0E7490;color:#fff;
    box-shadow:0 1px 0 rgba(7,46,58,.3), inset 0 1px 0 rgba(255,255,255,.14);
  }
  .btn-pay:hover{background:#0B5C73;}

  /* ── Premium gold (acento Aethon) ── */
  .btn-gold{
    background:#F0A026;color:#3A2208;
    box-shadow:0 1px 0 rgba(120,70,10,.25), inset 0 1px 0 rgba(255,255,255,.32);
  }
  .btn-gold:hover{background:#D78A14;color:#2B1804;}

  /* ── Danger: outline-on-rest, full red on hover ── */
  .btn-danger{
    background:#fff;color:#B91C1C;border-color:#FECACA;
  }
  .btn-danger:hover{background:#DC2626;color:#fff;border-color:#DC2626;}

  /* ── Ghost: ahora con borde azul tenue, no se desvanece ── */
  .btn-ghost{
    background:#fff;color:#1960A6;border-color:#BFDBFE;
    box-shadow:0 1px 0 rgba(15,23,42,.03);
  }
  .btn-ghost:hover{background:#EFF6FF;border-color:#1960A6;}

  /* ── Sizes ── */
  .btn-sm{padding:6px 12px;font-size:11.5px;border-radius:6px;}
  .btn-lg{padding:12px 22px;font-size:14.5px;border-radius:10px;}

  /* ── Disabled ── */
  .btn-disabled{opacity:.45;cursor:not-allowed;pointer-events:none;}

  /* ── Icons ── */
  .ico{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
  .ico-lg{width:18px;height:18px;}
</style></head>
<body>

<div class="label">Variantes · pasa el mouse encima</div>
<div class="row">

  <!-- Generar PDF: hover reveals PDF document icon -->
  <button class="btn btn-primary">
    <span class="label-text">Generar PDF</span>
    <span class="label-icon">
      <svg class="ico ico-lg" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><text x="7.5" y="18" font-size="6" font-weight="700" fill="currentColor" stroke="none" font-family="Inter,sans-serif">PDF</text></svg>
    </span>
  </button>

  <button class="btn btn-secondary">
    <span class="label-text">Cancelar</span>
    <span class="label-icon">
      <svg class="ico ico-lg" viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
    </span>
  </button>

  <!-- Excel: spreadsheet grid icon -->
  <button class="btn btn-excel">
    <span class="label-text">Exportar Excel</span>
    <span class="label-icon">
      <svg class="ico ico-lg" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="3" y1="9" x2="21" y2="9"/><line x1="3" y1="15" x2="21" y2="15"/><line x1="9" y1="3" x2="9" y2="21"/><line x1="15" y1="3" x2="15" y2="21"/></svg>
    </span>
  </button>

  <!-- Pagar liquidación: green + dollar/check icon -->
  <button class="btn btn-pay">
    <span class="label-text">Pagar liquidación</span>
    <span class="label-icon">
      <svg class="ico ico-lg" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9 12l2 2 4-4"/></svg>
    </span>
  </button>

  <!-- Acción premium gold -->
  <button class="btn btn-gold">
    <span class="label-text">Acción premium</span>
    <span class="label-icon">
      <svg class="ico ico-lg" viewBox="0 0 24 24"><polygon points="12 2 15 9 22 9.3 16.5 14 18.5 21 12 17 5.5 21 7.5 14 2 9.3 9 9 12 2"/></svg>
    </span>
  </button>

  <!-- Eliminar: trash can on hover -->
  <button class="btn btn-danger">
    <span class="label-text">Eliminar</span>
    <span class="label-icon">
      <svg class="ico ico-lg" viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg>
    </span>
  </button>

  <button class="btn btn-ghost">
    <span class="label-text">Ver más →</span>
    <span class="label-icon">
      <svg class="ico ico-lg" viewBox="0 0 24 24"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
    </span>
  </button>

</div>

<div class="label">Tamaños</div>
<div class="row">
  <button class="btn btn-primary btn-sm">
    <span class="label-text">Pequeño</span>
    <span class="label-icon"><svg class="ico" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg></span>
  </button>
  <button class="btn btn-primary">
    <span class="label-text">Normal</span>
    <span class="label-icon"><svg class="ico ico-lg" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg></span>
  </button>
  <button class="btn btn-primary btn-lg">
    <span class="label-text">Grande</span>
    <span class="label-icon"><svg class="ico ico-lg" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg></span>
  </button>
  <button class="btn btn-primary btn-disabled"><span class="label-text">Deshabilitado</span></button>
</div>

</body></html>
