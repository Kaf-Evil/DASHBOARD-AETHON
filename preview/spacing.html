<!doctype html>
<html lang="es"><head>
<meta charset="utf-8"/>
<title>Spacing</title>
<link rel="stylesheet" href="../colors_and_type.css"/>
<style>
  body{margin:0;background:#fff;padding:22px 28px;display:flex;flex-direction:column;gap:10px;}
  .row{display:flex;align-items:center;gap:14px;}
  .lab{font-family:var(--font-mono);font-size:11px;color:var(--fg3);width:84px;flex-shrink:0;}
  .bar{height:14px;background:var(--aethon-500);border-radius:3px;}
  .px{font-size:11px;color:var(--fg4);font-family:var(--font-mono);}
</style></head>
<body>
<div class="row"><div class="lab">space-1</div><div class="bar" style="width:4px"></div><div class="px">4px</div></div>
<div class="row"><div class="lab">space-2</div><div class="bar" style="width:8px"></div><div class="px">8px</div></div>
<div class="row"><div class="lab">space-3</div><div class="bar" style="width:12px"></div><div class="px">12px</div></div>
<div class="row"><div class="lab">space-4</div><div class="bar" style="width:16px"></div><div class="px">16px</div></div>
<div class="row"><div class="lab">space-6</div><div class="bar" style="width:24px"></div><div class="px">24px</div></div>
<div class="row"><div class="lab">space-8</div><div class="bar" style="width:32px"></div><div class="px">32px</div></div>
<div class="row"><div class="lab">space-12</div><div class="bar" style="width:48px"></div><div class="px">48px</div></div>
<div class="row"><div class="lab">space-20</div><div class="bar" style="width:80px"></div><div class="px">80px</div></div>
</body></html>
